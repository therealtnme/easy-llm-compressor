[project]
name = "llm-compressor"
version = "0.1.3"
description = "Constraint-driven structural compression for Hugging Face LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.56",
    "accelerate>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "safetensors",
]

[project.scripts]
llm-compress = "llm_compressor.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_compressor*"]